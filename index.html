<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a66b9c">
  <meta name="description" content="A little place for our memories, stories, and everyday love.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Love Hub">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Our Love Hub · 只属于我们的世界 ♡</title>
  <style>
    :root{color-scheme:light;--ink:#513449;--muted:#8e7184;--rose:#b978a7;--lilac:#8b7ab6;--edge:rgba(255,255,255,.82)}
    *{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;min-height:100svh;position:relative;overflow-x:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 6%,#ffe0ee 0,transparent 50%),radial-gradient(ellipse at 92% 82%,#e9deff 0,transparent 53%),linear-gradient(140deg,#fcf5fa,#f7efff 90%)}
    body:before,body:after{content:"♡";position:fixed;pointer-events:none;color:#e6a1c7;opacity:.28;font:clamp(8rem,23vw,21rem)/1 Georgia,serif;z-index:0}
    body:before{left:-.1em;top:-.26em;transform:rotate(-18deg)}body:after{right:-.2em;bottom:-.27em;transform:rotate(18deg)}
    [hidden]{display:none!important}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9479bd;outline-offset:4px}
    .frame{position:relative;z-index:1;width:min(100%,1120px);margin:auto;padding:32px 24px}
    #gate{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding-block:48px}
    .gate-card{width:min(100%,480px);padding:clamp(25px,5vw,45px);border-radius:36px;border:1px solid var(--edge);background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 25px 75px #7b4f8022,0 3px 12px #9c5c8b0a;text-align:center}
    .logo{display:block;object-fit:contain;box-shadow:0 14px 36px #92567d32;border-radius:24%;margin:auto}.gate-logo{width:112px;height:112px}
    .eyebrow{margin:24px 0 9px;text-transform:uppercase;font-size:.7rem;letter-spacing:.3em;font-weight:750;color:#b47e9f}
    .gate-card h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(2.2rem,6vw,3rem);letter-spacing:-.045em;line-height:1.12;margin:0}
    .sub{font-size:.96rem;line-height:1.8;color:var(--muted);margin:18px auto 26px;max-width:310px}
    .divider{display:flex;align-items:center;gap:15px;color:#c88bac;margin:26px 0}.divider:before,.divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#e9cddd,transparent)}
    .field{text-align:left}.field label{display:block;font-weight:750;font-size:.86rem;margin-bottom:10px}
    .date-wrap{border:1px solid #e9cedf;background:#fffafd;border-radius:17px;padding:3px 14px;display:flex;align-items:center;gap:9px;box-shadow:inset 0 1px 5px #a0699a08}.date-wrap svg{color:#b57da8;flex:0 0 20px}
    input[type=date]{width:100%;min-width:0;min-height:52px;border:0;background:transparent;outline:0;color:var(--ink);font-size:1rem;letter-spacing:.03em}input[type=date]:focus-visible{outline:none}
    .hint{margin:9px 0 0;font-size:.8rem;line-height:1.5;color:#9d8093}
    .enter{border:0;width:100%;min-height:54px;border-radius:999px;background:linear-gradient(115deg,#b778a4,#8f7abb);color:#fff;font-weight:750;margin-top:22px;box-shadow:0 11px 25px #a46d9f37;transition:transform .2s,box-shadow .2s}.enter:hover{transform:translateY(-2px);box-shadow:0 15px 29px #a46d9f47}
    #error{min-height:23px;margin:12px 0 0;color:#a54273;font-size:.84rem;font-weight:650}#error:empty{visibility:hidden}
    .footnote{font-size:.79rem;color:#a18b9b;margin:13px 0 0}
    @media(max-width:670px){.frame{padding-inline:17px}.gate-card{border-radius:27px}#gate{padding-block:28px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="gate" class="frame">
    <section class="gate-card" aria-labelledby="gateTitle">
      <img class="logo gate-logo" src="./assets/icon-192.png" alt="Our Love Hub 爱心 Logo" width="112" height="112">
      <p class="eyebrow">M ♡ T · ONLY OURS</p>
      <h1 id="gateTitle">只属于我们的<br>小小世界</h1>
      <p class="sub">有些日子，值得记一辈子。<br>用我们的纪念日，打开藏着回忆的小宇宙。</p>
      <div class="divider" aria-hidden="true">♡</div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="anniversary">我们在一起的那一天</label>
          <div class="date-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg><input id="anniversary" type="date" required aria-describedby="dateHint error" autocomplete="off"></div>
          <p class="hint" id="dateHint">选择正确的年、月、日，就能进入 ♡</p>
        </div>
        <button class="enter" type="submit">打开我们的世界 &nbsp;♡</button>
        <p id="error" role="alert" aria-live="polite"></p>
      </form>
      <p class="footnote">From our first day · to forever</p>
    </section>
  </main>
  <script>
  (function(){
    'use strict';
    var KEY='our_love_hub_unlocked_at';
    var DAY='2024-03-23';
    var form=document.getElementById('loginForm');
    var error=document.getElementById('error');
    var input=document.getElementById('anniversary');
    function openJourney(){
      // Resolve relative to this index so GitHub Pages repo paths work correctly.
      window.location.replace(new URL('./Our-Journey/',document.baseURI).href);
    }
    function unlocked(){
      try { return !!sessionStorage.getItem(KEY); }
      catch (_) { return false; }
    }
    // An unlocked tab goes straight to Our Journey; no intermediate dashboard.
    if (unlocked()) { openJourney(); return; }
    form.addEventListener('submit',function(e){
      e.preventDefault();
      if (!input.value){
        error.textContent='先选择我们在一起的日期哦 ♡';
        input.focus();
        return;
      }
      if (input.value!==DAY){
        error.textContent='好像不是那一天，再想想我们的故事 ♡';
        input.focus();
        return;
      }
      try { sessionStorage.setItem(KEY,String(Date.now())); } catch (_) {}
      // Preserve the existing short-lived birthday-story unlock on hub login.
      try {
        var stamp=String(Date.now());
        localStorage.setItem('thinthin_story_unlocked_at',stamp);
        sessionStorage.setItem('thinthin_story_unlocked_at',stamp);
      } catch (_) {}
      error.textContent='';
      openJourney();
    });
    input.addEventListener('input',function(){error.textContent='';});
    if ('serviceWorker' in navigator) {
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(function(){});
      });
    }
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8eafa"><meta name="robots" content="noindex,nofollow"><title>Always Yours ♡ 安全聊天测试</title><link rel="icon" href="../assets/favicon-32.png"><link rel="stylesheet" href="styles.css?v=1"></head><body>
<main class="page">
<header class="top"><a href="../Our-Journey/" class="back">← Our Journey</a><span class="testbadge">独立测试版 · 不影响旧 Chat</span></header>
<section id="gate" class="shell gate">
  <img class="logo" src="../assets/icon-192.png" alt="Our Love Hub" onerror="this.style.display='none'">
  <div class="eyebrow">OUR LOVE HUB · 2024.03.23</div><h1>Always Yours <span>♡</span></h1>
  <p class="lead">仅已获批准的 HE / SHE 设备可以使用此测试聊天室。<strong>无需输入共同密钥。</strong></p>
  <div class="roles"><button type="button" data-role="Ko Ko"><span class="symbol">♡</span><strong>HE</strong><small>Ko Ko · 男朋友</small></button><button type="button" data-role="Chit Chit"><span class="symbol">✿</span><strong>SHE</strong><small>Chit Chit · 女朋友</small></button></div>
  <p id="gateStatus" class="status" role="status" aria-live="polite">请选择此设备已经批准的身份。</p>
  <div class="notes">此页面使用全新的加密通道，不会显示旧聊天记录。首次使用时自动在本机生成独立的消息解密私钥。<a href="../Device-Approval/">远程设备审批 ↗</a></div>
</section>
<section id="chat" class="shell chat hidden" aria-label="仅限授权设备的测试聊天">
 <div class="chatHead"><div><div class="eyebrow">JUST THE TWO OF US ♡</div><h2>Always Yours ♡</h2><div id="who" class="who"></div></div><button id="exit" class="outline" type="button">切换身份</button></div>
 <div id="chatStatus" class="status" role="status" aria-live="polite"></div>
 <div id="messages" class="messages"></div>
 <form id="composer" class="composer"><label for="message">写给 TA 的悄悄话 ♡</label><div class="write"><textarea id="message" rows="2" maxlength="3200" placeholder="想和 TA 说些什么…" required></textarea><button type="submit" id="send">发送 ♡</button></div><div class="hint">只有已经登记加密公钥的授权设备可读取新消息 · 最多保留30天 · 不保存共同密码</div></form>
</section>
<footer>2024.03.23 ♡ M + T · 测试通道不会访问旧消息</footer>
</main><script src="app.js?v=1" defer></script></body></html>

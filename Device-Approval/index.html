<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f9ebf7">
<title>设备授权管理 ♡ Our Love Hub</title>
<style>
:root{color-scheme:light;--ink:#61455d;--muted:#947d96;--line:#ebcfe9;--a:#b477ae;--b:#9986d2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Myanmar","Microsoft YaHei",sans-serif;color:var(--ink)}body{background:radial-gradient(ellipse at 0 5%,#f8dfec,transparent 65%),radial-gradient(ellipse at 100% 100%,#e9dfff,transparent 60%),#fffafe;padding:max(20px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));}main{max-width:720px;margin:4vh auto 0;border:1px solid #fff;border-radius:32px;padding:clamp(22px,5vw,48px);background:rgba(255,255,255,.78);box-shadow:0 22px 60px #a36aa01c;}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{color:#b46a9e;font-weight:800;letter-spacing:.14em;font-size:11px}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(27px,6vw,40px);margin:14px 0 9px;}p{line-height:1.8;color:var(--muted)}a{color:var(--a);font-size:14px;text-decoration:none;font-weight:700}label{display:block;margin:25px 0 9px;font-weight:700;font-size:14px}.field{width:100%;font:inherit;padding:16px 17px;border-radius:17px;border:1px solid var(--line);background:#fff;outline-color:var(--a);color:var(--ink);min-height:54px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:13px 0 22px}button{border:1px solid var(--line);border-radius:16px;padding:14px 20px;color:var(--ink);font-weight:750;background:white;cursor:pointer;min-height:49px;font-size:14px}button.primary{border:0;background:linear-gradient(120deg,var(--a),var(--b));color:#fff;flex:1}button:disabled{opacity:.5;cursor:wait}.status{font-size:14px;padding:13px 16px;border-radius:14px;background:#f8f0fa;color:#78557c;margin:12px 0}.status.error{background:#fff0f0;color:#a5455b}.status.ok{background:#edf8f0;color:#396a56}.panel{margin-top:18px;border:1px solid var(--line);border-radius:20px;padding:18px;background:#fffafc}.panel h2{font-size:17px;margin:2px 0 12px}.item{border:1px solid #e7cfe5;border-radius:15px;background:#fff;padding:15px;margin:10px 0}.role{font-weight:800;color:#a26099}.finger{overflow-wrap:anywhere;word-break:break-all;background:#faf1fa;color:#765875;padding:12px;border-radius:12px;margin:11px 0;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;user-select:all}.meta{font-size:12px;color:var(--muted)}.approve{display:block;margin-left:auto;border-color:#dbb9dc;background:#f9eff9}.hint{font-size:13px;margin-top:20px}#results:empty{display:none}@media(max-width:420px){.actions{flex-direction:column}.actions button{width:100%}.approve{width:100%}main{border-radius:24px;margin-top:8px;padding:21px}}</style>
</head>
<body><main>
<header><span class="eyebrow">OUR LOVE HUB ♡ JUST THE TWO OF US</span><a href="../Always-Yours-Chat/">← 返回安全聊天</a></header>
<h1>设备授权管理 ♡</h1>
<p>您和女朋友即使不在同一个地方，也可以远程批准设备。对方在 Chat 中提交申请，您在这里核对<strong>完整设备指纹</strong>后手动批准即可。</p>
<label for="token">管理员授权口令（至少 10 位）</label>
<input id="token" class="field" type="password" minlength="10" maxlength="256" autocomplete="off" spellcheck="false" placeholder="只在本次审批使用，不会保存" aria-describedby="privacy" />
<div class="actions"><button type="button" id="toggle">显示 / 隐藏口令</button><button class="primary" type="button" id="refresh">查看设备授权记录 ↻</button></div>
<div id="status" class="status" role="status" aria-live="polite">尚未读取授权记录。请使用您在 Supabase 设置的原始管理员口令，而非摘要。</div>
<section id="results" aria-live="polite"></section>
<p class="hint" id="privacy">安全提示：口令不会写入本地存储或 GitHub；本页面关闭时清除输入框。只有核对过对方通过私下联系方式发来的完整指纹，才点击批准。设备认证已用于新版安全聊天；请只批准您认识的设备。<strong>请勿在公共设备使用。</strong></p>
</main>
<script>
'use strict';
const API='https://zegjegutcigbydtzggur.supabase.co/functions/v1/always-yours-chat';
const input=document.getElementById('token'),status=document.getElementById('status'),results=document.getElementById('results');
const refresh=document.getElementById('refresh'),toggle=document.getElementById('toggle');
let loading=false;
// 只允许人工审批；页面不自动批准任何设备。
function note(msg,type=''){status.textContent=msg;status.className='status '+type;}
async function call(action,extra={}){
 const token=input.value;
 if(token.length<10)throw new Error('请输入至少10位的管理员口令。');
 const response=await fetch(API+'/api/owner/devices/'+action,{
  method:'POST',mode:'cors',cache:'no-store',referrerPolicy:'no-referrer',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({adminToken:token,...extra})
 });
 let payload={};try{payload=await response.json();}catch{}
 if(!response.ok||!payload.ok)throw new Error(payload.error||('服务器错误 '+response.status));
 return payload;
}
function node(tag,cls,content){const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.textContent=content;return el;}
async function load(){
 if(loading)return;loading=true;refresh.disabled=true;results.replaceChildren();note('正在核对管理员口令并读取申请…');
 try{
  const data=await call('list');
  const list=Array.isArray(data.devices)?data.devices:[];
  if(!list.length){note('目前没有设备记录。请让对方在聊天页面先申请。','ok');return;}
  const pending=list.filter(d=>d.status==='pending'),approved=list.filter(d=>d.status==='approved'),revoked=list.filter(d=>d.status==='revoked');
  note(`设备记录：${approved.length} 台已批准、${pending.length} 台待审核、${revoked.length} 台已撤销。`, 'ok');
  for(const [group,label] of [[pending,'待审核设备'],[approved,'已授权设备'],[revoked,'已撤销设备']]){
   if(!group.length)continue;
   const panel=node('div','panel'),title=node('h2','',`${label} · ${group.length}`);panel.appendChild(title);
   for(const item of group){
   if(!['Ko Ko','Chit Chit'].includes(item.user_name)||!/^[A-Za-z0-9_-]{43}$/.test(item.fingerprint||''))continue;
   const card=node('div','item');
   card.appendChild(node('div','role',(item.user_name==='Ko Ko'?'HE · Ko Ko':'SHE · Chit Chit')));
   card.appendChild(node('div','meta',item.status==='approved'?'已批准 · 设备指纹':'完整设备指纹（请与申请手机显示内容核对）'));
   card.appendChild(node('div','finger',item.fingerprint));
   const time=Number(item.requested_at);if(Number.isFinite(time)&&time>0)card.appendChild(node('div','meta','申请时间：'+new Date(time).toLocaleString()));
   if(item.status==='approved'&&item.approved_at)card.appendChild(node('div','meta','批准时间：'+new Date(Number(item.approved_at)).toLocaleString()));
   if(item.status==='revoked'&&item.revoked_at){card.appendChild(node('div','meta','撤销时间：'+new Date(Number(item.revoked_at)).toLocaleString()));}
   const copy=node('button','', '复制完整设备指纹');copy.type='button';
   copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(item.fingerprint);note('已复制指纹。请通过独立渠道核对，避免误批准。','ok');}catch{note('复制失败，请长按上方指纹手动复制。','error');}});
   card.appendChild(copy);
   if(item.status!=='pending'){panel.appendChild(card);continue;}
   const approve=node('button','approve','✓ 确认批准此设备');
   approve.type='button';approve.addEventListener('click',async()=>{
    if(loading)return;
    const identity=item.user_name==='Ko Ko'?'HE · Ko Ko':'SHE · Chit Chit';
    if(!confirm(`您已经通过私下联系方式核对了这台 ${identity} 设备的完整指纹吗？\n\n${item.fingerprint}\n\n只批准您认识的设备。`))return;
    const suffix=item.fingerprint.slice(-8);
    const checked=prompt(`最后确认：请输入设备指纹末尾 8 位（区分大小写）\n${suffix}`);
    if(checked!==suffix){if(checked!==null)note('设备指纹核对不一致，已取消批准。','error');return;}
    loading=true;approve.disabled=true;
    try{await call('approve',{user_name:item.user_name,fingerprint:item.fingerprint});note('已批准 '+identity+' 的设备。已授权设备列表会保留记录。','ok');setTimeout(load,0);}
    catch(e){note(e.message||'批准失败','error');approve.disabled=false;}
    finally{loading=false;}
   });
   card.appendChild(approve);panel.appendChild(card);
  }
   results.appendChild(panel);
  }
 }catch(e){note(e.message||'读取失败，请稍后重试','error');}
 finally{loading=false;refresh.disabled=false;}
}
refresh.addEventListener('click',load);
toggle.addEventListener('click',()=>{input.type=input.type==='password'?'text':'password';});
input.addEventListener('keydown',e=>{if(e.key==='Enter')load();});
window.addEventListener('pagehide',()=>{input.value='';});
</script></body></html>
